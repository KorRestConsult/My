<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Илья · Life OS</title>
<style>html,body{margin:0;min-height:100%;background:#0f0d0b;color:#f6ead8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center}</style>
</head>
<body><div class="boot">Загрузка…</div>
<script>
(async()=>{
  const response=await fetch('app.html?v=contrast-20260806',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  let html=await response.text();
  const css=`
/* FINAL CONTRAST OVERRIDE — 2026-08-06 */
.topbar{background:rgba(18,16,13,.98)!important;border-bottom:1px solid rgba(199,150,75,.48)!important;box-shadow:0 4px 18px rgba(0,0,0,.28)!important}
.topbar h1{color:#f7ead0!important;text-shadow:0 1px 0 rgba(0,0,0,.25)!important}
.topbar .avatar{color:#d8aa5d!important;border-color:#b9853e!important;background:rgba(185,133,62,.08)!important}
.topbar .nav-btn{color:#ddd4c7!important;opacity:1!important;text-shadow:0 1px 1px rgba(0,0,0,.4)!important}
.topbar .nav-btn svg{stroke:#d8a64f!important;opacity:1!important}
.topbar .nav-btn.active{background:#3a2b1b!important;color:#ffd590!important;box-shadow:inset 0 0 0 1px rgba(218,166,79,.72)!important}
.topbar .nav-btn.active svg{stroke:#ffd590!important}
.hq-hero{color:#f6ead8!important}
.hq-hero .hero-metric strong,.hq-hero .hero-metric strong span,.hq-hero .progress-card b,.hq-hero .progress-value,.hq-hero .ring-hour,.hq-hero .ring-center,.hq-hero .weekday,.hq-hero .month-label,.hq-hero .day-number{color:#f6ead8!important}
.hq-hero .hero-metric>div>span,.hq-hero .hero-metric div>span:not(#caloriesLabel),.hq-hero .section-kicker{color:#cfc5b7!important}
.hq-hero .time-pill{color:#17120d!important}
.hq-hero .progress-card svg,.hq-hero .hero-icon{color:var(--accent,#d8a64f)!important}
@media(max-width:900px){.topbar h1{color:#f7ead0!important}.topbar .nav-btn{color:#ddd4c7!important}.hq-hero .progress-card{color:#f6ead8!important}}
`;
  html=html.replace('</style>',css+'</style>');
  document.open();document.write(html);document.close();
})().catch(error=>{document.body.innerHTML='<div class="boot">Ошибка загрузки сайта: '+String(error.message||error)+'</div>'});
</script></body></html>
