name: Debug Todoist close
on:
  push:
    paths:
      - '.github/workflows/debug-netlify-close-20260812.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Today response
        run: |
          curl -sS -i 'https://ilya-life-os.netlify.app/todoist?action=today' || true
      - name: Complete response
        run: |
          curl -sS -i -X POST 'https://ilya-life-os.netlify.app/todoist' \
            -H 'Origin: https://korrestconsult.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"complete","taskId":"6hGJ6C6Mm4h2M4vX"}' || true
      - name: Remove debug workflows
        run: |
          rm -f .github/workflows/debug-netlify-close-20260812.yml
          rm -f .github/workflows/test-netlify-close-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Убрать диагностику закрытия Todoist" && git push; fi
