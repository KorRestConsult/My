name: Debug Todoist bridge
on:
  push:
    paths:
      - '.github/workflows/debug-netlify-todoist-bridge-20260812.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect health response
        run: |
          curl -sS -i 'https://ilya-life-os.netlify.app/todoist?action=health' || true
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/debug-netlify-todoist-bridge-20260812.yml
          rm -f .github/workflows/test-netlify-todoist-bridge-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Убрать временные workflow диагностики"
            git push
          fi
