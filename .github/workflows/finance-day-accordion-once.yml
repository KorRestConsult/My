name: Apply finance day accordion once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          begin='<!-- FINANCE_DAY_ACCORDION_BEGIN -->'
          end='<!-- FINANCE_DAY_ACCORDION_END -->'
          if begin in text and end in text:
              a=text.index(begin)
              b=text.index(end,a)+len(end)
              text=text[:a]+text[b:]
          payload=''
          block=base64.b64decode(payload).decode('utf-8')
          pos=text.rfind('</body>')
          if pos < 0:
              raise SystemExit('Closing body tag not found')
          text=text[:pos]+block+'\n'+text[pos:]
          path.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/finance-day-accordion-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/finance-day-accordion-once.yml
          git commit -m "Smooth finance day accordion"
          git push
