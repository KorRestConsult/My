name: Life OS unified day

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-unified-day.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch unified day UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          start='<!-- LIFE_OS_COMMAND_BLOCK_START -->'
          end='<!-- LIFE_OS_COMMAND_BLOCK_END -->'
          a=s.find(start)
          b=s.find(end,a)
          if a<0 or b<0:
              raise SystemExit('command block markers not found')
          b += len(end)

          block=r'''<!-- LIFE_OS_COMMAND_BLOCK_START -->
<style>
#home .life-primary-tasks{display:none!important}
#home .life-panel-blocks>.section-card:has(#homeCalendar),
#home .life-panel-blocks>.section-card:has(#homeHabits){display:none!important}
#lifeCommandCard{position:relative;overflow:hidden;padding:0!important;border-radius:16px!important;background:linear-gradient(160deg,#fffdf8 0%,#f7efe1 100%)!important;border:1px solid rgba(155,112,58,.24)!important;box-shadow:0 14px 34px rgba(69,47,22,.08);margin-bottom:14px}
#lifeCommandCard:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,rgba(185,133,62,.9),rgba(185,133,62,.25),transparent)}
.life-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 15px;background:linear-gradient(135deg,rgba(216,190,146,.18),rgba(255,255,255,.34));border-bottom:1px solid rgba(116,91,57,.14)}
.life-command-kicker{font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin-bottom:6px}
.life-command-time{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.life-command-title{font:700 25px/1.08 Georgia,"Times New Roman",serif;color:var(--ink);margin-top:5px;max-width:620px}
.life-command-meta{font-size:11px;color:var(--muted);margin-top:6px}
.life-command-clock{min-width:52px;text-align:right;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.life-command-actions{padding:8px 16px 13px}
.life-command-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid rgba(116,91,57,.11)}
.life-command-row:last-child{border-bottom:0}.life-command-row .os-check{width:23px;height:23px}.life-command-row-title{font-size:13px;line-height:1.25;color:var(--ink)}
.life-command-kind{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;font:500 8px/1.15 Inter,system-ui,sans-serif;letter-spacing:.01em;vertical-align:2px;border:1px solid transparent}
.life-command-kind.kind-habit{background:rgba(190,148,87,.09);border-color:rgba(190,148,87,.14);color:rgba(126,91,43,.63)}
.life-command-kind.kind-task{background:rgba(94,125,148,.08);border-color:rgba(94,125,148,.14);color:rgba(69,94,113,.64)}
.life-command-row-time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.life-command-empty{padding:10px 0 4px;color:var(--muted);font-size:12px}
.life-command-next{margin:4px 16px 15px;padding:10px 11px;border:1px solid rgba(183,119,36,.16);border-radius:10px;background:rgba(255,255,255,.42);font-size:11px;color:var(--muted)}.life-command-next b{color:var(--ink)}
.life-command-carry{margin-top:7px;padding-top:8px;border-top:1px dashed rgba(116,91,57,.18)}
.life-command-carry-title{font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:rgba(112,96,78,.62);margin-bottom:1px}
.life-command-carry .life-command-row{opacity:.82}
@media(max-width:560px){#lifeCommandCard{border-radius:14px!important}.life-command-head{padding:14px 12px 13px}.life-command-actions{padding:7px 12px 11px}.life-command-next{margin:4px 12px 13px}.life-command-title{font-size:23px}.life-command-row-title{font-size:13.5px}.life-command-kind{font-size:7.8px;padding:2px 5px}}
</style>
<script>
(function(){
 const CMD_ID='lifeCommandCard';
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
 function hm(v){var m=String(v||'').match(/(?:^|\s)(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
 function fmt(min){if(min==null)return'';min=((min%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')}
 function itemTime(item){return hm(item.note)||hm(item.time)||hm(item.start)||hm(item.title)}
 function cleanTitle(item){return String(item.title||'').replace(/^\s*\d{1,2}:\d{2}\s*[·•-]?\s*/,'').trim()}
 function cleanBlockTitle(v){return String(v||'').replace(/\s*·\s*(?:см\.\s*)?Todoist\s*$/i,'').replace(/\s*·\s*привычки\s+в\s+Todoist\s*$/i,'').trim()||'Сейчас'}
 function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
 function actionRows(day,includeDone){var rows=[];(day.tasks||[]).forEach(function(x,i){if(includeDone||!x.done)rows.push({kind:'task',index:i,item:x,time:itemTime(x),title:cleanTitle(x),type:'Дело',done:!!x.done})});(day.habits||[]).forEach(function(x,i){if(includeDone||!x.done)rows.push({kind:'habit',index:i,item:x,time:itemTime(x),title:cleanTitle(x),type:'Привычка',done:!!x.done})});return rows.sort(function(a,b){return (a.time==null?99999:a.time)-(b.time==null?99999:b.time)})}
 function eventRows(day){return (day.events||[]).map(function(e,i){return{index:i,item:e,start:hm(e.start||e.time),end:hm(e.end),title:cleanBlockTitle(e.title||'Событие')}}).filter(function(e){return e.start!=null}).sort(function(a,b){return a.start-b.start})}
 function model(day){
   var now=nowMin(),pending=actionRows(day,false),events=eventRows(day);
   var active=events.find(function(e){return e.start<=now&&(e.end==null||now<e.end)});
   var start,end,title,meta,nextEvent;
   if(active){
     start=active.start;end=active.end==null?Math.min(1440,start+60):active.end;title=active.title;meta=active.item.place||active.item.category||'';nextEvent=events.find(function(e){return e.start>=end});
   }else{
     var prev=null;events.forEach(function(e){var ee=e.end==null?e.start+60:e.end;if(ee<=now)prev=e});
     nextEvent=events.find(function(e){return e.start>now});
     start=prev?(prev.end==null?prev.start+60:prev.end):now;
     end=nextEvent?nextEvent.start:1440;
     title='Свободное время';meta='';
   }
   var current=pending.filter(function(a){return a.time!=null&&a.time>=start&&a.time<end});
   var floating=pending.filter(function(a){return a.time==null});
   floating.forEach(function(a){if(!current.some(function(x){return x.kind===a.kind&&x.index===a.index}))current.push(a)});
   current.sort(function(a,b){return (a.time==null?99999:a.time)-(b.time==null?99999:b.time)});
   var carry=pending.filter(function(a){return a.time!=null&&a.time<start});
   var nextAction=pending.find(function(a){return a.time!=null&&a.time>=end});
   var next=null;
   if(nextEvent)next={time:nextEvent.start,title:nextEvent.title};
   else if(nextAction)next={time:nextAction.time,title:nextAction.title};
   return{mode:'Сейчас',start:start,end:end,title:title,meta:meta,actions:current,carry:carry,next:next};
 }
 function row(a){var cls=a.kind==='habit'?'kind-habit':'kind-task';return '<div class="life-command-row"><button class="os-check" type="button" onclick="toggleDayItem(\''+a.kind+'\','+a.index+');setTimeout(window.renderLifeCommandBlock,0)" aria-label="Выполнено"></button><div><div class="life-command-row-title">'+esc(a.title)+'<span class="life-command-kind '+cls+'">'+esc(a.type)+'</span></div></div><div class="life-command-row-time">'+(a.time!=null?esc(fmt(a.time)):'')+'</div></div>'}
 function render(){if(typeof todayDay!=='function')return;var hq=document.querySelector('#home .hq');if(!hq)return;var day=todayDay(),m=model(day),card=document.getElementById(CMD_ID);if(!card){card=document.createElement('section');card.id=CMD_ID;card.className='section-card';hq.insertBefore(card,hq.firstElementChild)}var rows=m.actions.length?m.actions.map(row).join(''):'<div class="life-command-empty">В этом блоке ничего не осталось.</div>';var carry=m.carry&&m.carry.length?'<div class="life-command-carry"><div class="life-command-carry-title">Осталось · '+m.carry.length+'</div>'+m.carry.map(row).join('')+'</div>':'';var nx=m.next?'<div class="life-command-next">Дальше в <b>'+esc(fmt(m.next.time))+'</b> — '+esc(m.next.title)+'</div>':'';card.innerHTML='<div class="life-command-head"><div><div class="life-command-kicker">'+esc(m.mode)+'</div><div class="life-command-time">'+esc(fmt(m.start))+(m.end<1440?'–'+esc(fmt(m.end)):'')+'</div><div class="life-command-title">'+esc(m.title)+'</div>'+(m.meta?'<div class="life-command-meta">'+esc(m.meta)+'</div>':'')+'</div><div class="life-command-clock">'+esc(fmt(nowMin()))+'</div></div><div class="life-command-actions">'+rows+carry+'</div>'+nx}
 window.renderLifeCommandBlock=render;var old=window.refreshLifeOsToday;if(typeof old==='function')window.refreshLifeOsToday=async function(){var r=await old.apply(this,arguments);render();return r};window.addEventListener('load',function(){setTimeout(render,100);setInterval(render,60000)});document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(render,50)});setTimeout(render,50)
})();
</script>
<!-- LIFE_OS_COMMAND_BLOCK_END -->'''
          s=s[:a]+block+s[b:]

          boot_style='''<!-- LIFE_OS_BOOT_SPLASH_STYLE_START -->\n<style id="lifeOsBootSplashStyle">\n#lifeBootSplash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:linear-gradient(180deg,#191714 0%,#242019 100%);color:#f7efe2;transition:opacity .28s ease,visibility .28s ease}\n#lifeBootSplash.life-boot-hide{opacity:0;visibility:hidden;pointer-events:none}\n.life-boot-inner{display:grid;justify-items:center;gap:13px;transform:translateY(-4vh)}\n.life-boot-mark{display:flex;align-items:center;gap:13px;font:700 38px/1 Georgia,"Times New Roman",serif;letter-spacing:.01em}\n.life-boot-mark:before{content:"";width:4px;height:44px;border-radius:99px;background:linear-gradient(#d7a254,#8a5b25);box-shadow:0 0 18px rgba(201,145,65,.2)}\n.life-boot-sub{font:600 9px/1.2 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,239,226,.48)}\n.life-boot-line{width:74px;height:2px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}.life-boot-line:after{content:"";display:block;width:44%;height:100%;background:#b9853e;animation:lifeBootMove 1s ease-in-out infinite alternate}@keyframes lifeBootMove{from{transform:translateX(-20%)}to{transform:translateX(150%)}}\n</style>\n<!-- LIFE_OS_BOOT_SPLASH_STYLE_END -->'''
          if 'LIFE_OS_BOOT_SPLASH_STYLE_START' not in s:
              s=s.replace('</head>',boot_style+'\n</head>',1)

          boot_markup='''<!-- LIFE_OS_BOOT_SPLASH_START -->\n<div id="lifeBootSplash" aria-hidden="true"><div class="life-boot-inner"><div class="life-boot-mark">Life OS</div><div class="life-boot-sub">Илья · система дня</div><div class="life-boot-line"></div></div></div>\n<script>(function(){var el=document.getElementById('lifeBootSplash');function hide(){if(!el)return;el.classList.add('life-boot-hide');setTimeout(function(){if(el&&el.parentNode)el.parentNode.removeChild(el)},320)}window.addEventListener('load',function(){setTimeout(hide,120)});setTimeout(hide,1800)})();</script>\n<!-- LIFE_OS_BOOT_SPLASH_END -->'''
          if 'LIFE_OS_BOOT_SPLASH_START' not in s:
              m=re.search(r'<body[^>]*>',s,re.I)
              if not m: raise SystemExit('body tag not found')
              pos=m.end();s=s[:pos]+'\n'+boot_markup+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Cleanup workflow
        run: rm -f .github/workflows/lifeos-unified-day.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Собрать единый экран дня и заставку Life OS"
          git push origin main
