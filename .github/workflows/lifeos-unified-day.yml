name: Life OS unified day

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-unified-day.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch unified day UI
        run: python3 .github/patch_unified_day.py
      - name: Cleanup temporary files
        run: |
          rm -f .github/patch_unified_day.py
          rm -f .github/workflows/lifeos-unified-day.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Собрать единый экран дня и заставку Life OS"
          git push origin main
