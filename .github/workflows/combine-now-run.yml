name: Combine now run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/combine-now-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        run: python3 .tmp/combine_now.py
      - name: Commit result
        run: |
          rm -f .tmp/combine_now.py
          rm -f .github/workflows/combine-now-run.yml
          rm -f .github/workflows/combine-now-block-20260811.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Объединить расписание и выполнение в главный блок"
          git push origin main
