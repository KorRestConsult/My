name: Apply Todoist cache bump
on:
  push:
    paths:
      - '.github/workflows/apply-todoist-cache-20260812.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch_todoist_cache_20260812.py
      - name: Commit patch and cleanup
        run: |
          rm -f .github/patch_todoist_cache_20260812.py .github/workflows/apply-todoist-cache-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Обновить клиент живой синхронизации Todoist"
          git push
