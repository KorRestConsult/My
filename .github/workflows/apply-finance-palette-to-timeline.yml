name: Apply finance palette to timeline
on:
  push:
    paths:
      - '.github/workflows/apply-finance-palette-to-timeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timeline styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="#lifeCommandCard{position:relative;overflow:hidden;padding:0!important;border-radius:16px!important;background:linear-gradient(155deg,#fffaf0 0%,#f3e5cf 100%)!important;border:1px solid rgba(166,112,43,.38)!important;box-shadow:0 16px 38px rgba(83,55,22,.13),inset 0 0 0 1px rgba(255,255,255,.48);margin-bottom:16px}"
          new="#lifeCommandCard{position:relative;overflow:hidden;padding:0!important;border-radius:16px!important;background:linear-gradient(145deg,rgba(185,138,79,.14),rgba(255,250,242,.98) 58%)!important;border:1.5px solid rgba(185,138,79,.52)!important;box-shadow:0 16px 38px rgba(78,57,31,.13);margin-bottom:16px}"
          old2=".life-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 15px;background:linear-gradient(135deg,rgba(206,164,96,.24),rgba(255,249,238,.74));border-bottom:1px solid rgba(143,96,37,.22);box-shadow:inset 0 -10px 24px rgba(154,106,49,.045)}"
          new2=".life-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 15px;background:linear-gradient(145deg,rgba(185,138,79,.25),rgba(255,250,242,.76));border-bottom:1.5px solid rgba(185,138,79,.42);box-shadow:inset 4px 0 0 rgba(185,133,62,.86)}"
          old3=".life-command-row.is-overdue{margin-left:-7px;margin-right:-7px;padding-left:7px;padding-right:7px;border-radius:9px;background:linear-gradient(90deg,rgba(182,86,77,.075),rgba(182,86,77,.025) 62%,transparent)}"
          new3=".life-command-row.is-overdue{margin:5px -7px;padding:9px 7px;border:1px solid rgba(182,86,77,.34);border-radius:10px;background:linear-gradient(145deg,rgba(182,86,77,.13),rgba(255,250,242,.72))}"
          old4=".life-command-row.is-overdue .os-check{border-color:rgba(182,86,77,.62)!important}"
          new4=".life-command-row.is-overdue .os-check{border-color:rgba(182,86,77,.78)!important;background:rgba(182,86,77,.035)!important}"
          old5=".life-command-row.is-overdue .life-command-row-time{color:rgba(166,71,62,.86);font-weight:750}"
          new5=".life-command-row.is-overdue .life-command-row-time{color:#a64036;font-weight:800}"
          old6=".life-command-overdue{display:inline-block;margin-left:6px;padding:2px 5px;border-radius:999px;background:rgba(182,86,77,.08);border:1px solid rgba(182,86,77,.14);color:rgba(154,67,59,.72);font:500 7.5px/1.15 Inter,system-ui,sans-serif;vertical-align:2px;letter-spacing:.01em}"
          new6=".life-command-overdue{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:rgba(182,86,77,.12);border:1px solid rgba(182,86,77,.28);color:#a64036;font:600 7.5px/1.15 Inter,system-ui,sans-serif;vertical-align:2px;letter-spacing:.01em}"
          for a,b in [(old,new),(old2,new2),(old3,new3),(old4,new4),(old5,new5),(old6,new6)]:
              if a not in s:
                  raise SystemExit('expected style not found')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-finance-palette-to-timeline.yml
          git add index.html .github/workflows/apply-finance-palette-to-timeline.yml
          git commit -m 'Усилить контраст таймлайна палитрой Финансов'
          git push
