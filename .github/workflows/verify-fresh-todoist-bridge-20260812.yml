name: Verify fresh Todoist bridge
on:
  push:
    paths:
      - '.github/workflows/verify-fresh-todoist-bridge-20260812.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Health
        run: curl -fsS 'https://ilya-todoist-bridge.netlify.app/todoist?action=health'
      - name: Close test task through bridge
        run: |
          curl -fsS -X POST 'https://ilya-todoist-bridge.netlify.app/todoist' \
            -H 'Origin: https://korrestconsult.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"complete","taskId":"6hGJ6C6Mm4h2M4vX"}'
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/verify-fresh-todoist-bridge-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Убрать end-to-end тест Todoist bridge" && git push; fi
