name: Apply Todoist direct cache bump
on:
  push:
    paths:
      - '.github/workflows/apply-todoist-direct-cache-20260812.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/patch_todoist_direct_cache.py
      - name: Commit and clean
        run: |
          rm -f .github/patch_todoist_direct_cache.py .github/workflows/apply-todoist-direct-cache-20260812.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github
          git commit -m 'Включить прямую синхронизацию Todoist в браузере'
          git push
