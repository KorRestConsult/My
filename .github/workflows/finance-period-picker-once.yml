name: Finance period picker one-shot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch finance period picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          begin='<!-- FINANCE_PERIOD_PICKER_BEGIN -->'
          end='<!-- FINANCE_PERIOD_PICKER_END -->'
          if begin in s and end in s:
              a=s.index(begin); b=s.index(end,a)+len(end); s=s[:a]+s[b:]
          block=r'''<!-- FINANCE_PERIOD_PICKER_BEGIN -->
          <style>
          #financeKpis .finance-period-trigger{cursor:pointer;position:relative;transition:transform .15s ease}
          #financeKpis .finance-period-trigger:active{transform:scale(.985)}
          #financeKpis .finance-period-trigger::after{content:"⌄";position:absolute;right:10px;top:9px;color:var(--gold2);opacity:.75}
          .finance-period-backdrop[hidden]{display:none!important}
          .finance-period-backdrop{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:12px;background:rgba(36,32,26,.30);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);overscroll-behavior:contain;touch-action:none}
          .finance-period-dialog{width:min(382px,calc(100vw - 24px));min-height:382px;max-height:calc(100dvh - 24px);overflow:auto;background:linear-gradient(155deg,#fffdf8,#f5ecdd);border:1px solid var(--line);border-radius:18px;box-shadow:0 28px 80px rgba(50,37,21,.28);padding:16px;overscroll-behavior:contain}
          .finance-period-top{display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center;min-height:38px}
          .finance-period-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:800}
          .finance-period-title{font:700 20px/1.1 Georgia,"Times New Roman",serif;color:var(--ink);margin-top:3px}
          .finance-period-close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.62);font-size:20px;display:grid;place-items:center}
          .finance-period-year{height:42px;margin-top:16px;display:grid;grid-template-columns:38px 1fr 38px;gap:8px;align-items:center}
          .finance-period-year button{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.60);color:var(--gold2);font-size:20px}
          .finance-period-year button:disabled{opacity:.24;cursor:default}
          .finance-period-year-value{text-align:center;font:700 22px/1 Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}
          .finance-period-months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:52px;gap:8px;margin-top:14px}
          .finance-period-month{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.58);color:var(--ink);font-size:12px;font-weight:800;padding:0 6px}
          .finance-period-month.is-selected{background:var(--green);border-color:var(--green);color:#fffaf2}
          .finance-period-month:disabled{background:rgba(116,91,57,.045);border-color:rgba(116,91,57,.09);color:rgba(117,107,95,.32);cursor:default}
          .finance-period-note{height:20px;margin-top:12px;text-align:center;color:var(--muted);font-size:10px;line-height:20px}
          @media(max-width:430px){.finance-period-dialog{width:100%;min-height:374px;padding:14px}.finance-period-months{grid-auto-rows:50px;gap:7px}}
          </style>
          <div class="finance-period-backdrop" id="financePeriodBackdrop" hidden aria-hidden="true">
            <section class="finance-period-dialog" role="dialog" aria-modal="true" aria-labelledby="financePeriodTitle">
              <div class="finance-period-top"><div><div class="finance-period-kicker">Финансовый период</div><div class="finance-period-title" id="financePeriodTitle">Выберите месяц</div></div><button class="finance-period-close" id="financePeriodClose" type="button" aria-label="Закрыть">×</button></div>
              <div class="finance-period-year"><button id="financePeriodPrevYear" type="button" aria-label="Предыдущий год">‹</button><div class="finance-period-year-value" id="financePeriodYear">2026</div><button id="financePeriodNextYear" type="button" aria-label="Следующий год">›</button></div>
              <div class="finance-period-months" id="financePeriodMonths"></div>
              <div class="finance-period-note">Будущие месяцы недоступны</div>
            </section>
          </div>
          <script>
          (function(){
          if(window.__financePeriodPickerInstalled)return; window.__financePeriodPickerInstalled=true;
          const now=new Date(), MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
          const state=window.__financePeriodState||(window.__financePeriodState={year:now.getFullYear(),month:now.getMonth(),pickerYear:now.getFullYear(),scrollY:0,locked:false,bodyStyle:null,htmlOverflow:""});
          function data(){try{return typeof financeDashboardData==="function"?(typeof todayDay==="function"?financeDashboardData(todayDay()):financeDashboardData()):null}catch(_){return null}}
          function opDate(row){try{const raw=typeof pick==="function"?pick(row,["date","дата"]):(row.date||row["дата"]);return typeof parseFinanceDate==="function"?parseFinanceDate(raw):new Date(raw)}catch(_){return null}}
          function amount(row){try{return typeof financeOperationAmount==="function"?financeOperationAmount(row):Number(row.amount||row["сумма"]||0)||0}catch(_){return 0}}
          function minYear(ops,yr){let m=yr;(ops||[]).forEach(r=>{const d=opDate(r);if(d&&!Number.isNaN(d.getTime())&&d.getFullYear()<=yr)m=Math.min(m,d.getFullYear())});return m}
          function totals(year,month){const d=data(), n=new Date(); if(!d)return{income:0,expense:0,minYear:year}; if(year===n.getFullYear()&&month===n.getMonth())return{income:Number(d.monthIncome)||0,expense:Number(d.monthExpense)||0,minYear:minYear(d.operations,n.getFullYear())}; let income=0,expense=0;(d.operations||[]).forEach(r=>{const dt=opDate(r);if(!dt||Number.isNaN(dt.getTime())||dt.getFullYear()!==year||dt.getMonth()!==month)return;const v=amount(r);if(v>0)income+=v;if(v<0)expense+=Math.abs(v)});return{income,expense,minYear:minYear(d.operations,n.getFullYear())}}
          function money(v){try{return typeof moneyText==="function"?moneyText(v):new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB",maximumFractionDigits:0}).format(v)}catch(_){return Math.round(v)+" ₽"}}
          function label(y,m){const t=MONTHS[m].toLocaleLowerCase("ru-RU");return y===new Date().getFullYear()?t:t+" "+y}
          function enhance(){const root=document.getElementById("financeKpis");if(!root)return;const cards=[...root.querySelectorAll(":scope > .finance-kpi")],inc=cards.find(c=>((c.querySelector("span")||{}).textContent||"").trim().toLocaleLowerCase("ru-RU").startsWith("доход за")),exp=cards.find(c=>((c.querySelector("span")||{}).textContent||"").trim().toLocaleLowerCase("ru-RU").startsWith("расход за"));if(!inc||!exp)return;[[inc,"income"],[exp,"expense"]].forEach(([c,m])=>{c.classList.add("finance-period-trigger");c.dataset.metric=m;c.setAttribute("role","button");c.setAttribute("tabindex","0");c.setAttribute("aria-haspopup","dialog")});const t=totals(state.year,state.month),l=label(state.year,state.month);inc.querySelector("span").textContent="Доход за "+l;exp.querySelector("span").textContent="Расход за "+l;inc.querySelector("b").textContent=money(t.income);exp.querySelector("b").textContent=money(t.expense)}
          function lock(){if(state.locked)return;state.locked=true;state.scrollY=window.scrollY||0;state.bodyStyle=document.body.getAttribute("style");state.htmlOverflow=document.documentElement.style.overflow||"";document.documentElement.style.overflow="hidden";Object.assign(document.body.style,{position:"fixed",top:(-state.scrollY)+"px",left:"0",right:"0",width:"100%",overflow:"hidden"})}
          function unlock(){if(!state.locked)return;state.locked=false;if(state.bodyStyle===null)document.body.removeAttribute("style");else document.body.setAttribute("style",state.bodyStyle);document.documentElement.style.overflow=state.htmlOverflow;window.scrollTo(0,state.scrollY||0)}
          function renderPicker(){const y=document.getElementById("financePeriodYear"),ms=document.getElementById("financePeriodMonths"),prev=document.getElementById("financePeriodPrevYear"),next=document.getElementById("financePeriodNextYear");if(!y||!ms)return;const n=new Date(),min=totals(state.year,state.month).minYear;state.pickerYear=Math.max(min,Math.min(state.pickerYear,n.getFullYear()));y.textContent=state.pickerYear;prev.disabled=state.pickerYear<=min;next.disabled=state.pickerYear>=n.getFullYear();ms.innerHTML=MONTHS.map((name,i)=>{const future=state.pickerYear===n.getFullYear()&&i>n.getMonth(),selected=state.pickerYear===state.year&&i===state.month;return `<button type="button" class="finance-period-month${selected?" is-selected":""}" data-month="${i}" ${future?'disabled aria-disabled="true"':""}>${name}</button>`}).join("")}
          function open(){const b=document.getElementById("financePeriodBackdrop");if(!b)return;state.pickerYear=state.year;renderPicker();lock();b.hidden=false;b.setAttribute("aria-hidden","false");requestAnimationFrame(()=>{const f=b.querySelector(".is-selected")||document.getElementById("financePeriodClose");if(f)f.focus({preventScroll:true})})}
          function close(){const b=document.getElementById("financePeriodBackdrop");if(!b||b.hidden)return;b.hidden=true;b.setAttribute("aria-hidden","true");unlock()}
          document.addEventListener("click",e=>{const tr=e.target.closest&&e.target.closest("#financeKpis .finance-period-trigger");if(tr){e.preventDefault();open();return}if(e.target.id==="financePeriodClose"){close();return}if(e.target.id==="financePeriodPrevYear"){state.pickerYear--;renderPicker();return}if(e.target.id==="financePeriodNextYear"){if(state.pickerYear<new Date().getFullYear())state.pickerYear++;renderPicker();return}const mb=e.target.closest&&e.target.closest("#financePeriodMonths .finance-period-month:not(:disabled)");if(mb){state.year=state.pickerYear;state.month=Number(mb.dataset.month);enhance();close();return}if(e.target.id==="financePeriodBackdrop")close()},true);
          document.addEventListener("keydown",e=>{const tr=e.target.closest&&e.target.closest("#financeKpis .finance-period-trigger");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();open()}else if(e.key==="Escape")close()},true);
          function observe(){const r=document.getElementById("financeKpis");if(!r)return false;new MutationObserver(()=>requestAnimationFrame(enhance)).observe(r,{childList:true});enhance();return true} if(!observe()){const o=new MutationObserver(()=>{if(observe())o.disconnect()});o.observe(document.documentElement,{childList:true,subtree:true})}
          })();
          </script>
          <!-- FINANCE_PERIOD_PICKER_END -->'''
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('Closing body tag not found')
          p.write_text(s[:pos]+block+'\n'+s[pos:],encoding='utf-8')
          PY
          rm -f .github/workflows/finance-period-picker-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/finance-period-picker-once.yml
          git commit -m "Add finance month and year picker"
          git push
