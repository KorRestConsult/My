name: Apply simplified day and Todoist sync
on:
  push:
    paths:
      - '.github/workflows/apply-simplify-day-sync-20260811.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/patch_simplify_day_sync.py
      - name: Commit changes
        run: |
          rm -f .github/patch_simplify_day_sync.py .github/workflows/apply-simplify-day-sync-20260811.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/todoist-writeback.js .github/patch_simplify_day_sync.py .github/workflows/apply-simplify-day-sync-20260811.yml
          git commit -m 'Упростить картину дня и исправить Todoist sync'
          git push origin main
