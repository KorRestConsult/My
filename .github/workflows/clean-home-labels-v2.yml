name: Clean home labels v2
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("return section.startsWith('Привычки |');", "return section.startsWith('Привычки |')||section.startsWith('Блок |');"),
            ("if(calendarTitle)calendarTitle.textContent='Расписание · Google Calendar';", "if(calendarTitle)calendarTitle.textContent='Расписание';"),
            ("if(tasksTitle)tasksTitle.textContent='Дела · Todoist';", "if(tasksTitle)tasksTitle.textContent='Дела';"),
            ("if(habitsTitle)habitsTitle.textContent='Привычки · Todoist';", "if(habitsTitle)habitsTitle.textContent='Привычки';")
          ]
          for a,b in pairs:
            if a not in s:
              raise SystemExit('pattern missing')
            s=s.replace(a,b,1)
          if '<!-- LIFE_OS_CLEAN_LABELS_START -->' not in s:
            extra="""\n<!-- LIFE_OS_CLEAN_LABELS_START -->\n<style>\n#home #secretaryPanel>.secretary-top{display:none!important}\n#home #secretaryPanel{padding-top:12px!important}\n</style>\n<!-- LIFE_OS_CLEAN_LABELS_END -->\n"""
            s=s.replace('</body>',extra+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          for f in ['.github/workflows/clean-home-labels-20260811.yml','.github/workflows/clean-home-labels-v2.yml']:
            q=Path(f)
            if q.exists(): q.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Упростить подписи и вернуть ежедневные блоки в привычки"
          git push origin main
