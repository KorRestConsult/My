name: Fix live task fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-fallback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix live fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(!day.tasks.length)day.tasks=defaultTasks.map(item=>Object.assign({},item));","if(!day.tasks.length&&!window.LIFE_OS_LIVE_ACTIVE)day.tasks=defaultTasks.map(item=>Object.assign({},item));")
          s=s.replace("if(!day.events.length)day.events=defaultCalendar.map(item=>Object.assign({},item));","if(!day.events.length&&!window.LIFE_OS_LIVE_ACTIVE)day.events=defaultCalendar.map(item=>Object.assign({},item));")
          s=s.replace("day.habits=day.habits&&day.habits.length?day.habits:defaultDay().habits;","day.habits=day.habits&&day.habits.length?day.habits:(window.LIFE_OS_LIVE_ACTIVE?[]:defaultDay().habits);")
          anchor="const live=normalizeLiveToday(data);"
          if anchor in s and "window.LIFE_OS_LIVE_ACTIVE=true;" not in s:
              s=s.replace(anchor,anchor+"\n      window.LIFE_OS_LIVE_ACTIVE=true;",1)
          # Hide the legacy full habits card on the home screen robustly, without relying only on :has().
          anchor2="const habitCard=habitRoot.closest('.section-card');"
          if anchor2 in s and "habitCard.style.display='none'" not in s:
              s=s.replace(anchor2,anchor2+"\n    if(habitCard)habitCard.style.display='none';",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-live-fallback.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Убрать демо-задачи и старый блок привычек из живого экрана"
          git push origin main