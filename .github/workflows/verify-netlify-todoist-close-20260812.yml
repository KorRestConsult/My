name: Verify Todoist close through Netlify
on:
  push:
    paths:
      - '.github/workflows/verify-netlify-todoist-close-20260812.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Close test task
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://ilya-life-os.netlify.app/todoist' \
            -H 'Origin: https://korrestconsult.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"complete","taskId":"6hGJ6C6Mm4h2M4vX"}'
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/verify-netlify-todoist-close-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Убрать проверку закрытия Todoist" && git push; fi
