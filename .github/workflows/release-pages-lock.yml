name: Release stuck GitHub Pages lock

on:
  push:
    paths:
      - ".github/workflows/release-pages-lock.yml"

permissions:
  actions: write
  deployments: write
  pages: write
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel all active Pages workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          gh api "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed") | .id' | while read -r RUN_ID; do
            [ -z "$RUN_ID" ] || gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
          done
          sleep 15

      - name: Cancel the stuck internal Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          STUCK_SHA="d49d1ffc03727a094deb6b33bb7f669267cbf629"
          gh api --method POST "repos/$REPO/pages/deployments/$STUCK_SHA/cancel" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28"
          for ATTEMPT in $(seq 1 12); do
            STATUS=$(gh api "repos/$REPO/pages/deployments/$STUCK_SHA" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --jq '.status // ""' || true)
            echo "Pages deployment status: $STATUS"
            case "$STATUS" in
              cancelled|canceled|failed|failure|inactive|succeed|success|"") break ;;
            esac
            sleep 5
          done

      - name: Re-run only the approved Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/jobs/92629593025/rerun
