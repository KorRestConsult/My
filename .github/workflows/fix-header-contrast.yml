name: Repair GitHub Pages queue

on:
  push:
    paths:
      - ".github/workflows/fix-header-contrast.yml"

permissions:
  actions: write
  contents: write
  deployments: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Release stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/deployments/5779823762/statuses \
            -f state=inactive \
            -f description='Reset stuck GitHub Pages deployment' || true
          gh api --method POST repos/${{ github.repository }}/actions/runs/31103735603/cancel || true
          sleep 8
      - name: Trigger one clean Pages deployment
        run: |
          git config user.name "KorRestConsult"
          git config user.email "Korobicin@live.com"
          date -u +%FT%TZ > .pages-redeploy
          git add .pages-redeploy
          git commit -m "Restart Pages after queue reset"
          git push origin main
