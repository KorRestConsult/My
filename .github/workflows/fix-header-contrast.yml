name: Hard reset GitHub Pages deployment

on:
  push:
    paths:
      - ".github/workflows/fix-header-contrast.yml"

permissions:
  actions: write
  contents: read
  deployments: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel every active Pages run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo="${{ github.repository }}"
          gh api "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path=="dynamic/pages/pages-build-deployment") | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="in_progress") | .id' | while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Cancelling Pages run $run_id"
            gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" || true
          done

      - name: Mark every active Pages deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo="${{ github.repository }}"
          gh api "repos/$repo/deployments?environment=github-pages&per_page=100" --jq '.[].id' | while read -r deployment_id; do
            [ -z "$deployment_id" ] && continue
            state=$(gh api "repos/$repo/deployments/$deployment_id/statuses" --jq '.[0].state // ""')
            case "$state" in
              waiting|queued|pending|in_progress)
                echo "Deactivating deployment $deployment_id ($state)"
                gh api --method POST "repos/$repo/deployments/$deployment_id/statuses" -f state=inactive -f description='Release stuck GitHub Pages queue' || true
                ;;
            esac
          done

      - name: Wait for cancellation to settle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          for i in {1..18}; do
            status=$(gh api "repos/$repo/actions/runs/31104477217" --jq '.status')
            echo "Run 31104477217 status: $status"
            [ "$status" = "completed" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Re-run only the approved deploy job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/actions/jobs/92626032961/rerun"
