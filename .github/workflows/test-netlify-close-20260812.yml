name: Test Todoist close through bridge
on:
  push:
    paths:
      - '.github/workflows/test-netlify-close-20260812.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Close temporary task
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://ilya-life-os.netlify.app/todoist' \
            -H 'Origin: https://korrestconsult.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"complete","taskId":"6hGJ6C6Mm4h2M4vX"}'
      - name: Remove workflow
        run: |
          rm -f .github/workflows/test-netlify-close-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Убрать тест закрытия Todoist" && git push; fi
