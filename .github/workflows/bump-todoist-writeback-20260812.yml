name: Bump Todoist writeback cache
on:
  push:
    paths:
      - '.github/workflows/bump-todoist-writeback-20260812.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data/todoist-writeback.js?v=20260812-0956'
          new='data/todoist-writeback.js?v=20260812-1024'
          if old not in s:
              import re
              s,n=re.subn(r'data/todoist-writeback\.js\?v=[0-9-]+',new,s,count=1)
              if not n: raise SystemExit('todoist script tag not found')
          else:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/bump-todoist-writeback-20260812.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/bump-todoist-writeback-20260812.yml
          git commit -m 'Обновить клиент закрытия задач Todoist'
          git push