name: Reset GitHub Pages

on:
  push:
    paths:
      - ".github/workflows/reset-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  reset-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete current Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -o /tmp/delete.out -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" > /tmp/delete.code
          cat /tmp/delete.out || true
          code=$(cat /tmp/delete.code)
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            echo "Unexpected delete status: $code"
            exit 1
          fi

      - name: Recreate Pages from main root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -f \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"main","path":"/"}}'
