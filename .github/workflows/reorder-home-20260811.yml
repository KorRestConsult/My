name: Reorder Life OS home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorder-home-20260811.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reorder home blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          fragment = Path('data/home-reorder-fragment.html')
          text = index.read_text(encoding='utf-8')
          payload = fragment.read_text(encoding='utf-8')
          marker = '<!-- LIFE_OS_HOME_REORDER_START -->'
          if marker not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no </body>')
              text = text.replace('</body>', payload + '\n</body>', 1)
              index.write_text(text, encoding='utf-8')
          workflow = Path('.github/workflows/reorder-home-20260811.yml')
          if workflow.exists():
              workflow.unlink()
          if fragment.exists():
              fragment.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Перестроить главную: дела сверху, живые блоки в панели дня"
          git push origin main
