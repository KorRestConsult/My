name: Apply task completion UX
on:
  push:
    paths:
      - '.github/workflows/apply-task-completion-ux-20260811.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        run: python3 .github/patch_task_completion_ux.py
      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/patch_task_completion_ux.py .github/workflows/apply-task-completion-ux-20260811.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/patch_task_completion_ux.py .github/workflows/apply-task-completion-ux-20260811.yml
          git commit -m 'Сделать живой UX выполнения задач'
          git push origin main
