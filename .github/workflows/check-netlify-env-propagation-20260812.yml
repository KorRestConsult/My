name: Check Netlify Todoist env
on:
  push:
    paths:
      - '.github/workflows/check-netlify-env-propagation-20260812.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check health
        run: curl -sS -i 'https://ilya-life-os.netlify.app/todoist?action=health'
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/check-netlify-env-propagation-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Убрать проверку Netlify env" && git push; fi
