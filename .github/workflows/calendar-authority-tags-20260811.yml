name: Calendar authority and tags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-authority-tags-20260811.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch main command block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          css_anchor='.life-command-row-meta{font-size:9px;color:var(--muted);margin-top:2px}.life-command-row-time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}'
          css_new='.life-command-row-meta{font-size:9px;color:var(--muted);margin-top:2px}.life-command-kind{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;border:1px solid rgba(108,99,88,.16);background:rgba(108,99,88,.07);color:var(--muted);font:700 8.5px/1.15 Inter,system-ui,sans-serif;letter-spacing:.04em;text-transform:lowercase;vertical-align:2px}.life-command-row-time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}'
          if css_anchor not in text:
              raise SystemExit('css anchor not found')
          text=text.replace(css_anchor,css_new,1)

          new_model=""" function model(day){
  var now=nowMin(),actions=actionRows(day),events=eventRows(day);
  var activeEvent=events.find(function(e){return e.start<=now&&(e.end==null||now<e.end)});
  if(activeEvent){
    var ee=activeEvent.end==null?Math.min(1440,activeEvent.start+60):activeEvent.end;
    var following=events.find(function(e){return e.start>=ee});
    return{mode:'Сейчас',start:activeEvent.start,end:ee,title:activeEvent.title,meta:activeEvent.item.place||activeEvent.item.category||'',actions:actions.filter(function(a){return a.time==null||a.time<ee}),events:events,next:following?{time:following.start,title:following.title}:null};
  }
  var nextEvent=events.find(function(e){return e.start>now});
  if(nextEvent){
    return{mode:'До следующего блока',start:now,end:nextEvent.start,title:'Свободное время',meta:'',actions:actions.filter(function(a){return a.time==null||a.time<nextEvent.start}),events:events,next:{time:nextEvent.start,title:nextEvent.title}};
  }
  return{mode:'Сейчас',start:now,end:1440,title:'Свободное время',meta:'',actions:actions,events:events};
 }"""
          pattern=r" function model\(day\)\{.*?\n function render\(\)\{"
          if not re.search(pattern,text,flags=re.S):
              raise SystemExit('model block not found')
          text=re.sub(pattern,new_model+'\n function render(){',text,count=1,flags=re.S)

          old_row="<div><div class=\"life-command-row-title\">'+esc(a.title)+'</div></div><div class=\"life-command-row-time\">"
          new_row="<div><div class=\"life-command-row-title\">'+esc(a.title)+'<span class=\"life-command-kind\">'+esc(a.type)+'</span></div></div><div class=\"life-command-row-time\">"
          if old_row not in text:
              raise SystemExit('row renderer not found')
          text=text.replace(old_row,new_row,1)

          text=text.replace("<div class=\"life-command-actions\">'+rows+'+'</div>'+nx", "<div class=\"life-command-actions\">'+rows+'</div>'+nx",1)

          p.write_text(text,encoding='utf-8')
          wf=Path('.github/workflows/calendar-authority-tags-20260811.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Сделать Calendar основой времени и добавить теги дело/привычка"
          git push origin main
