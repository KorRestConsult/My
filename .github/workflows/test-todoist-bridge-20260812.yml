name: Test Todoist bridge end-to-end
on:
  push:
    paths:
      - '.github/workflows/test-todoist-bridge-20260812.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test live read
        run: |
          set -euo pipefail
          curl -fsS -H 'Origin: https://korrestconsult.github.io' 'https://ilya-life-os.netlify.app/api/todoist-today?date=2026-08-12' | tee /tmp/today.json
          grep -q '6hGHg27CGjQ8hH6F' /tmp/today.json
      - name: Test completion
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/close.out -w '%{http_code}' -X POST \
            -H 'Origin: https://korrestconsult.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"taskId":"6hGHg27CGjQ8hH6F"}' \
            'https://ilya-life-os.netlify.app/api/todoist-complete')
          echo "close_http=$code"
          cat /tmp/close.out || true
          test "$code" = "204"
      - name: Cleanup workflow
        if: success()
        run: |
          rm -f .github/workflows/test-todoist-bridge-20260812.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github
          git commit -m 'Убрать тест моста Todoist'
          git push
