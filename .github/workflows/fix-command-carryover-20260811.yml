name: Fix command carryover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-command-carryover-20260811.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current block behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          reps=[
            ("actions:actions.filter(function(a){return a.time!=null&&a.time>=activeEvent.start&&a.time<ee})",
             "actions:actions.filter(function(a){return a.time==null||a.time<ee})"),
            ("actions:timed.filter(function(x){return x.time>=active.a.time&&x.time<active.end})",
             "actions:actions.filter(function(x){return x.time==null||x.time<active.end})"),
            ("actions:untimed,next:n",
             "actions:actions.filter(function(a){return a.time==null||a.time<now}),next:n"),
            ("actions:untimed}}",
             "actions:actions}}"),
            ("<div class=\"life-command-row-meta\">'+esc(a.type)+'</div>",
             ""),
            ("<div class=\"life-command-actions-title\">Выполнить в этом блоке · '+count+'</div>'+rows",
             "'+rows+'")
          ]
          for old,new in reps:
              if old not in text:
                  raise SystemExit('pattern not found: '+old[:100])
              text=text.replace(old,new,1)

          # Remove now-unused heading spacing.
          text=text.replace('.life-command-actions{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}',
                            '.life-command-actions{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}',1)

          p.write_text(text,encoding='utf-8')

          # Clean temporary workflows from failed attempts plus this workflow itself.
          for f in [
            '.github/workflows/fix-command-carryover-20260811.yml',
            '.github/workflows/combine-now-block-20260811.yml',
            '.github/workflows/clean-home-labels-20260811.yml'
          ]:
              q=Path(f)
              if q.exists(): q.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Сохранять невыполненные дела при смене временного блока"
          git push origin main
