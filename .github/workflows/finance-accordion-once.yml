name: Finance accordion one-shot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch finance day accordion only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          begin='<!-- FINANCE_DAY_ACCORDION_BEGIN -->'
          end='<!-- FINANCE_DAY_ACCORDION_END -->'
          if begin in s and end in s:
              a=s.index(begin); b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]
          patch=r'''<!-- FINANCE_DAY_ACCORDION_BEGIN -->
<style id="financeDayAccordionStyles">
#financeOperations details.finance-day{overflow:hidden;will-change:height;transition:box-shadow .22s ease,transform .22s ease,border-color .22s ease}
#financeOperations details.finance-day[open]{box-shadow:0 8px 22px rgba(57,42,24,.08);transform:translateY(-1px)}
#financeOperations details.finance-day summary{user-select:none;-webkit-user-select:none}
#financeOperations details.finance-day .finance-day-toggle{transition:transform .24s cubic-bezier(.22,.8,.25,1)}
</style>
<script id="financeDayAccordionScript">
(function(){
  const root=document.getElementById('financeOperations');
  if(!root||root.dataset.smoothAccordion==='1')return;
  root.dataset.smoothAccordion='1';
  const duration=260;
  const easing='cubic-bezier(.22,.8,.25,1)';
  function clearAnim(d){
    if(d._financeAnim){try{d._financeAnim.cancel()}catch(_){ } d._financeAnim=null;}
    d.style.height='';d.style.overflow='';
  }
  function closeDay(d){
    if(!d||!d.open)return Promise.resolve();
    clearAnim(d);
    const summary=d.querySelector(':scope > summary');
    if(!summary){d.open=false;return Promise.resolve();}
    const from=d.getBoundingClientRect().height;
    const to=summary.getBoundingClientRect().height;
    d.style.overflow='hidden';
    d.style.height=from+'px';
    const a=d.animate([{height:from+'px',opacity:1},{height:to+'px',opacity:.98}],{duration,easing,fill:'forwards'});
    d._financeAnim=a;
    return a.finished.catch(()=>{}).then(()=>{
      if(d._financeAnim!==a)return;
      d.open=false;d._financeAnim=null;d.style.height='';d.style.overflow='';
    });
  }
  function openDay(d){
    if(!d||d.open)return;
    clearAnim(d);
    const summary=d.querySelector(':scope > summary');
    if(!summary)return;
    const from=summary.getBoundingClientRect().height;
    d.open=true;
    const to=d.scrollHeight;
    d.style.overflow='hidden';
    d.style.height=from+'px';
    const a=d.animate([{height:from+'px',opacity:.98},{height:to+'px',opacity:1}],{duration,easing,fill:'forwards'});
    d._financeAnim=a;
    a.finished.catch(()=>{}).then(()=>{
      if(d._financeAnim!==a)return;
      d._financeAnim=null;d.style.height='';d.style.overflow='';
    });
  }
  root.addEventListener('click',function(e){
    const summary=e.target.closest('details.finance-day > summary');
    if(!summary||!root.contains(summary))return;
    const day=summary.parentElement;
    e.preventDefault();
    if(day.open){closeDay(day);return;}
    root.querySelectorAll('details.finance-day[open]').forEach(other=>{if(other!==day)closeDay(other)});
    openDay(day);
  });
})();
</script>
<!-- FINANCE_DAY_ACCORDION_END -->'''
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html has no </body>')
          s=s.replace(marker,patch+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/finance-accordion-once.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Smooth finance day accordion"
          git push
