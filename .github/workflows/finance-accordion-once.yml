name: Finance accordion one-shot
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch finance accordion
        shell: bash
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); begin='<!-- FINANCE_DAY_ACCORDION_BEGIN -->'; end='<!-- FINANCE_DAY_ACCORDION_END -->'; a=s.find(begin); b=s.find(end,a)+len(end) if a>=0 else -1; s=(s[:a]+s[b:]) if a>=0 and b>=len(end) else s; patch=base64.b64decode('').decode(); s=s.replace('</body>',patch+'\n</body>',1); p.write_text(s,encoding='utf-8')"
          rm -f .github/workflows/finance-accordion-once.yml .github/workflows/finance-day-accordion-once.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Smooth finance day accordion"
          git push
