name: Tint current time block

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tint-current-time-block.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tint current time block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='#lifeCommandCard{padding:16px!important;border-radius:14px!important;background:linear-gradient(155deg,#fffdf8,#f5ecdd)!important;border:1px solid var(--line)!important;box-shadow:0 12px 32px rgba(62,43,22,.06);margin-bottom:14px}'
          new='#lifeCommandCard{padding:16px!important;border-radius:14px!important;background:linear-gradient(155deg,#fffaf0,#f2e3c9)!important;border:1px solid rgba(183,119,36,.23)!important;box-shadow:0 12px 32px rgba(62,43,22,.07),inset 0 1px 0 rgba(255,255,255,.65);margin-bottom:14px;position:relative;overflow:hidden}#lifeCommandCard:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,rgba(183,119,36,.70),rgba(218,176,111,.28));pointer-events:none}'
          if old not in text:
              raise SystemExit('card css anchor not found')
          text=text.replace(old,new,1)
          old2='.life-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}'
          new2='.life-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 14px;padding:11px 12px 12px;border-radius:10px;background:rgba(193,141,67,.075);border:1px solid rgba(183,119,36,.12)}'
          if old2 not in text:
              raise SystemExit('head css anchor not found')
          text=text.replace(old2,new2,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Cleanup workflow
        run: rm -f .github/workflows/tint-current-time-block.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Подкрасить активный временной блок"
          git push origin main
