name: Fix today logic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-today-logic-20260811.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch today logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          def rep(old,new,label):
              global text
              if old not in text:
                  raise SystemExit(f'pattern not found: {label}')
              text=text.replace(old,new,1)

          rep("return section.startsWith('Привычки |')||section.startsWith('Блок |');",
              "return section.startsWith('Привычки |');",
              'habit classification')

          rep("  function livePeriod(item){",
              "  const LOCAL_DONE_KEY='life_os_todoist_done_v2';\n\n  function isLocallyDone(kind,id){\n    try{\n      const saved=JSON.parse(localStorage.getItem(LOCAL_DONE_KEY)||'{}');\n      return !!(saved[todayKey]&&saved[todayKey][kind]&&saved[todayKey][kind][String(id)]);\n    }catch(_){return false}\n  }\n\n  function livePeriod(item){",
              'local done helper')

          rep("        done:!!item.done,\n        source:'Todoist',\n        section:item.section||''",
              "        done:!!item.done||isLocallyDone('habit',item.id||index),\n        source:'Todoist',\n        rawTodoistId:String(item.id||index),\n        section:item.section||''",
              'habit done merge')

          rep("        done:!!item.done,\n        source:'Todoist'",
              "        done:!!item.done||isLocallyDone('task',item.id||index),\n        source:'Todoist',\n        rawTodoistId:String(item.id||index)",
              'task done merge')

          rep("function taskRow(task,index){\n  return `<div class=\"task-row${task.done?\" done\":\"\"}\"><button class=\"os-check\" onclick=\"toggleDayItem('task',${index})\" aria-label=\"Отметить дело\"></button><div class=\"task-title\" onclick=\"toggleDayItem('task',${index})\">${escapeHtml(task.title)}</div><button class=\"menu-btn\" onclick=\"editTask(${index})\">⋮</button></div>`;\n}",
              "function taskRow(task,index){\n  if(task.done)return '';\n  return `<div class=\"task-row\"><button class=\"os-check\" onclick=\"toggleDayItem('task',${index})\" aria-label=\"Отметить дело\"></button><div class=\"task-title\" onclick=\"toggleDayItem('task',${index})\">${escapeHtml(task.title)}</div><button class=\"menu-btn\" onclick=\"editTask(${index})\">⋮</button></div>`;\n}",
              'hide completed tasks')

          rep("    const items=day.habits.map((habit,i)=>Object.assign({index:i},habit)).filter(h=>(h.period||\"Утро\")===period);",
              "    const items=day.habits.map((habit,i)=>Object.assign({index:i},habit)).filter(h=>(h.period||\"Утро\")===period).filter(h=>!h.done);",
              'hide completed habits')

          rep("function toggleDayItem(type,index){\n  const list=todayDay()[type===\"event\"?\"events\":type===\"habit\"?\"habits\":\"tasks\"];\n  list[index].done=!list[index].done;\n  save();\n  renderAll();\n}",
              "function toggleDayItem(type,index){\n  const list=todayDay()[type===\"event\"?\"events\":type===\"habit\"?\"habits\":\"tasks\"];\n  const item=list[index];\n  item.done=!item.done;\n  if((type===\"task\"||type===\"habit\")&&item.source===\"Todoist\"&&item.rawTodoistId){\n    try{\n      const key='life_os_todoist_done_v2';\n      const saved=JSON.parse(localStorage.getItem(key)||'{}');\n      saved[todayKey]=saved[todayKey]||{task:{},habit:{}};\n      saved[todayKey][type]=saved[todayKey][type]||{};\n      saved[todayKey][type][String(item.rawTodoistId)]=!!item.done;\n      localStorage.setItem(key,JSON.stringify(saved));\n    }catch(_){}\n  }\n  save();\n  renderAll();\n}",
              'persist local checks')

          # Hide local-only add/edit controls on panels that are sourced from external services.
          marker='<!-- LIFE_OS_EXTERNAL_SOURCE_UI_START -->'
          if marker not in text:
              css='''\n<!-- LIFE_OS_EXTERNAL_SOURCE_UI_START -->\n<style>\n#home .section-card:has(#homeTasks) .icon-btn,#home .section-card:has(#homeTasks) .add-line,\n#home .section-card:has(#homeCalendar) .icon-btn,#home .section-card:has(#homeCalendar) .add-line,\n#home .section-card:has(#homeHabits) .icon-btn,#home .section-card:has(#homeHabits) .add-line{display:none!important}\n</style>\n<!-- LIFE_OS_EXTERNAL_SOURCE_UI_END -->\n'''
              text=text.replace('</body>',css+'\n</body>',1)

          path.write_text(text,encoding='utf-8')

          wf=Path('.github/workflows/fix-today-logic-20260811.yml')
          if wf.exists(): wf.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить дела/привычки и локальное завершение на главной"
          git push origin main
