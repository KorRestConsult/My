name: Retest Todoist bridge health
on:
  push:
    paths:
      - '.github/workflows/retest-netlify-health-20260812.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Health
        run: |
          curl -sS -i 'https://ilya-life-os.netlify.app/todoist?action=health'
      - name: Remove workflow
        run: |
          rm -f .github/workflows/retest-netlify-health-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Убрать повторную проверку Netlify" && git push; fi
