name: Apply full day view
on:
  push:
    paths:
      - '.github/workflows/apply-full-day-20260811.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/patch_full_day.py
      - run: |
          rm -f .github/patch_full_day.py .github/workflows/apply-full-day-20260811.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/patch_full_day.py .github/workflows/apply-full-day-20260811.yml
          git commit -m 'Показывать полную картину задач дня'
          git push origin main
