name: Bump Todoist bridge client
on:
  push:
    paths:
      - '.github/workflows/bump-todoist-bridge-client-20260812.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump browser cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data/todoist-writeback.js?v=20260812-1024direct'
          new='data/todoist-writeback.js?v=20260812-1134bridge'
          if old not in s:
              raise SystemExit('old cache key not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit client update and cleanup
        run: |
          rm -f .github/workflows/bump-todoist-bridge-client-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Включить серверную синхронизацию Todoist"
          git push
