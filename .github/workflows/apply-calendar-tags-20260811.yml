name: Apply calendar tags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-calendar-tags-20260811.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/patch_calendar_tags.py
      - run: |
          rm -f .github/patch_calendar_tags.py
          rm -f .github/workflows/apply-calendar-tags-20260811.yml
          rm -f .github/workflows/calendar-authority-tags-20260811.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Синхронизировать главный блок с Calendar и добавить теги"
          git push origin main
