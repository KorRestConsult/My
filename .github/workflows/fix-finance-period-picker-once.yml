name: Fix finance period picker interaction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix picker taps and observer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('overscroll-behavior:contain;touch-action:none}', 'overscroll-behavior:contain}')
          s=s.replace('.finance-period-dialog{width:min(382px,calc(100vw - 24px));', '.finance-period-dialog{touch-action:manipulation;width:min(382px,calc(100vw - 24px));')
          s=s.replace('.finance-period-month{border:1px solid var(--line);', '.finance-period-month{touch-action:manipulation;border:1px solid var(--line);')

          old='inc.querySelector("span").textContent="Доход за "+l;exp.querySelector("span").textContent="Расход за "+l;inc.querySelector("b").textContent=money(t.income);exp.querySelector("b").textContent=money(t.expense)'
          new='const il="Доход за "+l,el="Расход за "+l,iv=money(t.income),ev=money(t.expense);if(inc.querySelector("span").textContent!==il)inc.querySelector("span").textContent=il;if(exp.querySelector("span").textContent!==el)exp.querySelector("span").textContent=el;if(inc.querySelector("b").textContent!==iv)inc.querySelector("b").textContent=iv;if(exp.querySelector("b").textContent!==ev)exp.querySelector("b").textContent=ev'
          if old not in s:
              raise SystemExit('enhance target not found')
          s=s.replace(old,new,1)

          old='const mb=e.target.closest&&e.target.closest("#financePeriodMonths .finance-period-month:not(:disabled)");if(mb){state.year=state.pickerYear;state.month=Number(mb.dataset.month);enhance();close();return}'
          new='const mb=e.target.closest&&e.target.closest("#financePeriodMonths .finance-period-month");if(mb){e.preventDefault();e.stopPropagation();if(mb.disabled||mb.getAttribute("aria-disabled")==="true")return;const m=Number(mb.dataset.month);if(!Number.isInteger(m)||m<0||m>11)return;state.year=state.pickerYear;state.month=m;renderPicker();enhance();requestAnimationFrame(close);return}'
          if old not in s:
              raise SystemExit('month click target not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-finance-period-picker-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-finance-period-picker-once.yml
          git commit -m "Fix finance month picker taps"
          git push